<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Superwoman's Hub | Admin Portal</title>
    <script>
      // Automatically redirect to the SPA root with #admin hash
      var target = '/#admin';
      if (window.location.pathname.includes('/products')) target = '/#admin/products';
      else if (window.location.pathname.includes('/orders')) target = '/#admin/orders';
      else if (window.location.pathname.includes('/settings')) target = '/#admin/settings';
      else if (window.location.pathname.includes('/dashboard')) target = '/#admin/dashboard';
      window.location.replace(target + (window.location.search || ''));
    </script>
  </head>
  <body style="background-color: #FAF7F2; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; color: #5A1224;">
    <p style="font-weight: 700; font-size: 16px; letter-spacing: 0.15em; margin: 0 0 8px 0;">SUPERWOMAN'S HUB</p>
    <p style="font-size: 13px; color: #8C7A6B; margin: 0;">Opening Admin Portal...</p>
  </body>
</html>
